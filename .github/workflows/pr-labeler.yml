name: PR Labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto-label PR
        uses: carlos-camara/qa-hub-actions/pr-labeler@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
