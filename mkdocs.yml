site_name: QA Hub Framework
site_url: https://carlos-camara.github.io/qa-hub-framework/
site_description: Documentation for the QA Hub Framework
site_author: Carlos Camara

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - javascripts/mermaid-init.js

theme:
  name: material
  logo: material/robot-industrial
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Core Library:
      - Element Types: elements.md
      - Utility Handlers: utilities.md
      - Logging: logging.md
  - Command Line:
      - CLI Guide: cli.md
      - Configuration: configuration.md
  - Gherkin Steps:
      - API Testing: api-testing.md
      - GUI Testing: gui-testing.md
      - PDF Testing: pdf-testing.md
      - Step Library: steps.md
  - Advanced:
      - Security Checks: security.md
      - POM Migration: page_objects_migration.md
  - Architecture:
      - Deep-Dive: architecture.md
      - Technical Blueprint: architecture_root.md
  - Community:
      - Contributing: contributing.md
      - Code of Conduct: code_of_conduct.md
      - Security Policy: security_policy.md
  - Internal Testing: testing-framework.md
